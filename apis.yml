name: TMRW Life Sciences *
description: >-
  TMRW Life Sciences is a medical technology company that builds the world's
  first and only FDA-cleared automated platform for the safe management and
  storage of frozen eggs and embryos used in IVF and fertility treatment. Its
  cryo-storage hardware combines robotic specimen handling with digital
  tracking, chain-of-custody monitoring, and real-time visibility for fertility
  clinics and their patients, replacing manual, paper-based handling of
  irreplaceable reproductive tissue. Deployed at clinic networks including CCRM
  Fertility, Pinnacle Fertility, RFC, and IVIRMA North America. TMRW is a
  private company backed by GV (Google Ventures). It publishes a Security &
  Trust program (SOC 2 Type 2, ISO 27001, ISO 27018) but does not expose a
  public developer portal, API, or specification surface.
